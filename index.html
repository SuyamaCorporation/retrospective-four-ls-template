<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4L 振り返りテンプレ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-enter { animation: slideIn 0.25s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .col-card { break-inside: avoid; }
  }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center text-purple-700 mb-2">4L 振り返りテンプレ</h1>
  <p class="text-center text-gray-500 mb-2 text-sm">Liked / Learned / Lacked / Longed For — アジャイルレトロスペクティブ</p>

  <!-- ヘッダー操作 -->
  <div class="bg-white rounded-xl shadow p-5 mb-6 no-print">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1" for="sprint-name">スプリント / イテレーション名</label>
        <input type="text" id="sprint-name" placeholder="例: Sprint 12 / 2026-Q4" maxlength="80"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1" for="team-name">チーム名</label>
        <input type="text" id="team-name" placeholder="例: 開発チームA" maxlength="50"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1" for="retro-date">日付</label>
        <input type="date" id="retro-date"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
      </div>
    </div>
    <div class="flex flex-wrap gap-3">
      <button onclick="exportMarkdown()" aria-label="Markdown形式で出力" class="px-5 py-2 bg-purple-600 text-white rounded-full text-sm font-semibold hover:bg-purple-700 transition">Markdown 出力</button>
      <button onclick="window.print()" aria-label="印刷またはPDFで保存" class="px-5 py-2 bg-blue-600 text-white rounded-full text-sm font-semibold hover:bg-blue-700 transition">印刷/PDF</button>
      <button onclick="clearAll()" aria-label="全件クリア" class="px-5 py-2 bg-red-100 text-red-700 rounded-full text-sm font-semibold hover:bg-red-200 transition">全クリア</button>
      <span class="self-center text-sm text-gray-400">全 <span id="total-count" class="font-bold text-gray-600">0</span> 件</span>
    </div>
  </div>

  <!-- 4L グリッド -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" id="board"></div>

  <!-- Markdown 出力エリア -->
  <div id="md-output" class="hidden bg-white rounded-xl shadow p-6 no-print">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-semibold text-gray-700">Markdown 出力（コピーしてチームに共有）</h3>
      <div class="flex gap-2">
        <button onclick="copyMd()" id="copy-btn" aria-label="Markdownをクリップボードにコピー" class="text-sm bg-purple-100 text-purple-700 px-3 py-1 rounded-lg hover:bg-purple-200 transition">コピー</button>
        <button onclick="document.getElementById('md-output').classList.add('hidden')"
          aria-label="Markdown出力を閉じる" class="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded-lg hover:bg-gray-200 transition">閉じる</button>
      </div>
    </div>
    <textarea id="md-text" readonly class="w-full h-72 border rounded-lg p-3 text-sm font-mono bg-gray-50 resize-none focus:outline-none"></textarea>
  </div>
</div>

<script>
const COLUMNS = [
  {
    key: 'liked',
    label: '👍 Liked',
    sub: 'よかったこと',
    color: 'bg-green-50',
    border: 'border-green-300',
    btn: 'bg-green-500 hover:bg-green-600',
    tag: 'bg-green-100 text-green-800 border border-green-200',
    header: 'text-green-700',
    desc: '上手くいったこと、続けたいこと、よかったプロセスや取り組み'
  },
  {
    key: 'learned',
    label: '📘 Learned',
    sub: '学んだこと',
    color: 'bg-blue-50',
    border: 'border-blue-300',
    btn: 'bg-blue-500 hover:bg-blue-600',
    tag: 'bg-blue-100 text-blue-800 border border-blue-200',
    header: 'text-blue-700',
    desc: '今期に学んだこと、気づき、新しい知識やスキル'
  },
  {
    key: 'lacked',
    label: '🔴 Lacked',
    sub: '足りなかったこと',
    color: 'bg-red-50',
    border: 'border-red-300',
    btn: 'bg-red-500 hover:bg-red-600',
    tag: 'bg-red-100 text-red-800 border border-red-200',
    header: 'text-red-700',
    desc: '改善すべきこと、不足していたリソース・スキル・プロセス'
  },
  {
    key: 'longed',
    label: '🌟 Longed For',
    sub: '望んでいたこと',
    color: 'bg-yellow-50',
    border: 'border-yellow-300',
    btn: 'bg-yellow-500 hover:bg-yellow-600',
    tag: 'bg-yellow-100 text-yellow-800 border border-yellow-200',
    header: 'text-yellow-700',
    desc: '次に試したいこと、あればよかったもの、将来への期待・要望'
  },
];

let data = { sprint: '', team: '', date: '', liked: [], learned: [], lacked: [], longed: [] };

function init() {
  const saved = localStorage.getItem('4l-retro-v2');
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) {}
  }
  data.date = data.date || new Date().toISOString().split('T')[0];
  document.getElementById('sprint-name').value = data.sprint || '';
  document.getElementById('team-name').value = data.team || '';
  document.getElementById('retro-date').value = data.date || '';
  document.getElementById('sprint-name').oninput = e => { data.sprint = e.target.value; save(); };
  document.getElementById('team-name').oninput = e => { data.team = e.target.value; save(); };
  document.getElementById('retro-date').oninput = e => { data.date = e.target.value; save(); };
  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  let total = 0;
  COLUMNS.forEach(col => {
    const items = data[col.key] || [];
    total += items.length;
    const section = document.createElement('div');
    section.className = `col-card ${col.color} rounded-xl border ${col.border} p-4`;
    section.innerHTML = `
      <div class="flex justify-between items-start mb-1">
        <h2 class="text-lg font-bold ${col.header}">${col.label}</h2>
        <span class="text-xs bg-white/70 text-gray-500 rounded-full px-2 py-0.5 border">${items.length}件</span>
      </div>
      <p class="text-xs text-gray-500 mb-1 font-medium">${col.sub}</p>
      <p class="text-xs text-gray-400 mb-3 leading-relaxed">${col.desc}</p>
      <div class="flex gap-2 mb-3">
        <input type="text" id="input-${col.key}" placeholder="追加..." maxlength="200"
          class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
          onkeydown="if(event.key==='Enter')addItem('${col.key}')">
        <button onclick="addItem('${col.key}')"
          class="${col.btn} text-white px-3 py-2 rounded-lg text-sm font-bold transition"
          aria-label="${col.label}に追加">＋</button>
      </div>
      <div id="cards-${col.key}" class="space-y-2">
        ${items.map((item, i) => `
          <div class="card-enter flex items-start gap-2 ${col.tag} rounded-lg px-3 py-2">
            <span class="flex-1 text-sm break-words">${escapeHtml(item)}</span>
            <button onclick="removeItem('${col.key}',${i})" aria-label="削除"
              class="text-gray-400 hover:text-red-500 shrink-0 font-bold text-base leading-none ml-1">×</button>
          </div>
        `).join('')}
      </div>
    `;
    board.appendChild(section);
  });
  document.getElementById('total-count').textContent = total;
}

function addItem(key) {
  const input = document.getElementById('input-' + key);
  const val = input.value.trim();
  if (!val) return;
  data[key].push(val);
  input.value = '';
  save();
  renderBoard();
  setTimeout(() => { document.getElementById('input-' + key).focus(); }, 50);
}

function removeItem(key, index) {
  data[key].splice(index, 1);
  save();
  renderBoard();
}

function clearAll() {
  if (!confirm('全データをクリアしますか？（スプリント名などは保持）')) return;
  data.liked = []; data.learned = []; data.lacked = []; data.longed = [];
  save();
  document.getElementById('md-output').classList.add('hidden');
  renderBoard();
}

function save() {
  localStorage.setItem('4l-retro-v2', JSON.stringify(data));
}

function exportMarkdown() {
  const sprint = data.sprint || '振り返り';
  const team = data.team ? ` — ${data.team}` : '';
  const date = data.date ? ` (${data.date})` : '';
  let md = `# ${sprint}${team} 4L 振り返り${date}\n\n`;
  COLUMNS.forEach(col => {
    md += `## ${col.label} — ${col.sub}\n\n`;
    const items = data[col.key] || [];
    if (items.length === 0) md += '_（記入なし）_\n\n';
    else { items.forEach(item => { md += `- ${item}\n`; }); md += '\n'; }
  });
  md += `---\n> 生成日時: ${new Date().toLocaleString('ja-JP')}`;
  document.getElementById('md-text').value = md;
  document.getElementById('md-output').classList.remove('hidden');
  document.getElementById('md-output').scrollIntoView({ behavior: 'smooth' });
}

function copyMd() {
  const ta = document.getElementById('md-text');
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'コピー済み！';
    btn.className = 'text-sm bg-green-100 text-green-700 px-3 py-1 rounded-lg';
    setTimeout(() => {
      btn.textContent = 'コピー';
      btn.className = 'text-sm bg-purple-100 text-purple-700 px-3 py-1 rounded-lg hover:bg-purple-200 transition';
    }, 2500);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

init();
</script>
</body>
</html>
